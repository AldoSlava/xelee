# The Xelee log drop (README.md). Secrets, set with `wrangler secret put`:
# ADMIN_TOKEN (reads; tools/fetch_logs.py sends it) and, optionally,
# DISCORD_WEBHOOK (a note in a private channel per upload).
name = "xelee-log-drop"
main = "src/index.js"
compatibility_date = "2026-09-01"

[[r2_buckets]]
binding = "LOGS"
bucket_name = "xelee-logs"

# Uploads per client IP per minute. Anyone can pull the URL out of the APK,
# so this, the size cap and the 30-day expiry are what keep junk cheap.
[[ratelimits]]
name = "UPLOADS"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 3
  period = 60
