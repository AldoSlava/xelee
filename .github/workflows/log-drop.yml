name: Log drop

# Deploys tools/log-drop, the Worker the launcher's Send logs row uploads to.
# Its settings are repository secrets: CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID to deploy, and LOGDROP_ADMIN_TOKEN and
# LOGDROP_DISCORD_WEBHOOK, which become the Worker's ADMIN_TOKEN and
# DISCORD_WEBHOOK. Runs on a push to main that changes the Worker, and by
# hand (Actions > Log drop > Run workflow) after a secret changes.
on:
  push:
    branches: [main]
    paths: ['tools/log-drop/**', '.github/workflows/log-drop.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: log-drop
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy the log drop
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
        working-directory: tools/log-drop
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      # A fork without the Cloudflare secrets has nothing to deploy to.
      - name: Check the secrets
        id: check
        working-directory: .
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN}" || -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "::notice::no CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets: not deploying"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/log-drop/package-lock.json

      - name: Install wrangler
        if: steps.check.outputs.ready == 'true'
        run: npm ci

      # The workers.dev URL is the one Send logs uploads to; it stays out of
      # the public log, as it stays out of the repository.
      - name: Deploy
        if: steps.check.outputs.ready == 'true'
        run: npx wrangler deploy 2>&1 | sed -E 's#https://[A-Za-z0-9.-]+\.workers\.dev#https://<hidden>.workers.dev#g'

      # Only the secrets set here are written; one that is unset keeps the
      # Worker's value (remove one with `wrangler secret delete`).
      - name: Set the Worker's secrets
        if: steps.check.outputs.ready == 'true'
        env:
          ADMIN_TOKEN: ${{ secrets.LOGDROP_ADMIN_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.LOGDROP_DISCORD_WEBHOOK }}
        run: |
          secrets=$(jq -n --arg a "${ADMIN_TOKEN}" --arg d "${DISCORD_WEBHOOK}" \
            '{ADMIN_TOKEN: $a, DISCORD_WEBHOOK: $d} | map_values(gsub("^\\s+|\\s+$"; "")) | with_entries(select(.value != ""))')
          if [[ "$(jq length <<< "${secrets}")" == 0 ]]; then
            echo "::notice::no LOGDROP_ADMIN_TOKEN / LOGDROP_DISCORD_WEBHOOK secrets: the Worker keeps its own"
          else
            npx wrangler secret bulk <<< "${secrets}"
          fi
